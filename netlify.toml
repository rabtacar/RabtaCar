[build]
  publish = "."
  
[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Every tag link (/rbc-xxxxxxx) opens the one shared alert page.
# force = true so it wins over the old rbc-*.html files.
[[redirects]]
  from = "/rbc-*"
  to = "/alert.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=3600"
