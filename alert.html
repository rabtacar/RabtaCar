<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RabtaCar - Smart Vehicle Alert System. Notify vehicle owner instantly without sharing phone numbers.">
    <title>RabtaCar Alert</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #C9FC01 0%, #FFD700 50%, #FFA500 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            animation: gradientShift 10s ease infinite;
            background-size: 200% 200%;
        }
        
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        
        .container {
            background: white;
            border-radius: 24px;
            padding: 35px 30px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 25px 70px rgba(0,0,0,0.35);
            text-align: center;
            animation: slideUp 0.5s ease-out;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header { margin-bottom: 25px; }
        .brand-name { font-size: 38px; font-weight: 800; color: #000; margin-bottom: 8px; }
        .tagline { font-size: 14px; color: #666; font-weight: 600; margin-bottom: 15px; }
        h1 { color: #333; font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        .subtitle { color: #666; font-size: 14px; line-height: 1.5; }
        
        .tag-section {
            margin: 20px 0;
            padding: 15px;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-radius: 12px;
        }
        
        .tag-id { font-size: 18px; color: #000; font-weight: 700; letter-spacing: 1px; }
        .section-title { font-size: 16px; font-weight: 700; color: #333; margin: 25px 0 15px; text-align: left; }
        
        .alert-options { margin: 20px 0; display: grid; gap: 10px; }
        
        .alert-button {
            display: flex; align-items: center; width: 100%; padding: 16px 18px;
            background: white; border: 2px solid #e8e8e8; border-radius: 14px;
            font-size: 15px; font-weight: 500; color: #333; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); text-align: left;
        }
        
        .alert-button:hover {
            border-color: #C9FC01; transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(201, 252, 1, 0.3);
        }
        
        .alert-button.selected {
            border-color: #C9FC01; background: linear-gradient(135deg, #f0ffe6 0%, #e8ffcc 100%);
            box-shadow: 0 4px 16px rgba(201, 252, 1, 0.4);
        }
        
        .alert-button .icon { margin-right: 14px; font-size: 24px; min-width: 28px; text-align: center; }
        .alert-button .text { flex: 1; }
        .alert-button .check { opacity: 0; color: #C9FC01; font-size: 20px; filter: brightness(0.6); }
        .alert-button.selected .check { opacity: 1; }
        
        .whatsapp-container { margin-top: 25px; display: none; animation: fadeIn 0.4s ease-out; }
        .whatsapp-container.show { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        .selected-issue { background: #f8f9fa; padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 14px; color: #666; }
        .selected-issue strong { color: #333; }
        
        .whatsapp-button {
            display: inline-flex; align-items: center; justify-content: center;
            background: #25D366; color: white; padding: 14px 28px; border-radius: 50px;
            text-decoration: none; font-size: 15px; font-weight: 700; transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4); width: 100%; flex-direction: column; gap: 3px;
        }
        
        .whatsapp-button:hover { background: #20BA5A; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5); }
        .button-text-ur { font-size: 18px; font-family: 'Noto Nastaliq Urdu', serif; line-height: 1.6; }
        .button-text-en { font-size: 14px; font-weight: 700; }
        
        .footer { margin-top: 30px; padding-top: 25px; border-top: 1px solid #e8e8e8; }
        .privacy-notice { display: flex; align-items: center; justify-content: center; color: #888; font-size: 13px; margin-bottom: 12px; }
        .lock-icon { color: #C9FC01; filter: brightness(0.6); margin-right: 6px; font-size: 16px; }
        .powered-by { color: #bbb; font-size: 12px; }
        .powered-by a { color: #999; text-decoration: none; font-weight: 600; }
        .note-box { width: 100%; min-height: 64px; margin-bottom: 14px; padding: 12px; border: 2px solid #e8e8e8; border-radius: 12px; font: inherit; font-size: 14px; resize: vertical; }
        .note-box:focus { outline: none; border-color: #C9FC01; }
        .notify-button { border: 0; cursor: pointer; font-family: inherit; }
        .notify-button:disabled { opacity: .6; cursor: default; transform: none; }
        .status { display: none; margin-top: 14px; padding: 12px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
        .status.ok { display: block; background: #e9fbe0; color: #1d5e10; }
        .status.err { display: block; background: #fde8e8; color: #8a1c1c; }
        .status a { color: inherit; font-weight: 700; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand-name">RabtaCar</div>
            <div class="tagline">#GetFoundNow</div>
            <h1>Vehicle Alert System</h1>
            <p class="subtitle">Select an issue to notify the vehicle owner instantly</p>
        </div>
        
        <div class="tag-section">
            <div class="tag-id" id="tagId">Tag ID: —</div>
        </div>
        
        <div class="section-title">🚨 Select Issue Type:</div>
        <div class="alert-options">
            <button class="alert-button" onclick="selectIssue(this, 'parking', 'No Parking Zone', '🚫')">
                <span class="icon">🚫</span> <span class="text">No Parking Zone</span> <span class="check">✓</span>
            </button>
            <button class="alert-button" onclick="selectIssue(this, 'towing', 'Vehicle Being Towed', '🚨')">
                <span class="icon">🚨</span> <span class="text">Vehicle Being Towed</span> <span class="check">✓</span>
            </button>
            <button class="alert-button" onclick="selectIssue(this, 'lights', 'Headlights On', '💡')">
                <span class="icon">💡</span> <span class="text">Headlights On</span> <span class="check">✓</span>
            </button>
            <button class="alert-button" onclick="selectIssue(this, 'door', 'Window/Door Open', '🚪')">
                <span class="icon">🚪</span> <span class="text">Window/Door Open</span> <span class="check">✓</span>
            </button>
            <button class="alert-button" onclick="selectIssue(this, 'emergency', 'Emergency Situation', '⚠️')">
                <span class="icon">⚠️</span> <span class="text">Emergency Situation</span> <span class="check">✓</span>
            </button>
            <button class="alert-button" onclick="selectIssue(this, 'other', 'Other Issue', '📝')">
                <span class="icon">📝</span> <span class="text">Other Issue</span> <span class="check">✓</span>
            </button>
        </div>
        
        <div class="whatsapp-container" id="whatsappContainer">
            <div class="selected-issue">
                <strong>Selected:</strong> <span id="selectedIssueText"></span>
            </div>
            <textarea id="note" maxlength="120" class="note-box"
                placeholder="Short note (optional) — e.g. tyre puncture / مختصر تفصیل"></textarea>
            <button type="button" id="notifyBtn" class="whatsapp-button notify-button" onclick="sendAlert()">
                <span class="button-text-ur">مطلع کریں</span>
                <span class="button-text-en">Notify Owner</span>
            </button>
            <div id="status" class="status" role="status"></div>
        </div>
        
        <div class="footer">
            <div class="privacy-notice">
                <span class="lock-icon">🔒</span>
                <span>Privacy protected. Numbers never shared.</span>
            </div>
            <div class="powered-by">Powered by <a href="/">RabtaCar</a></div>
        </div>
    </div>

    <script>
        // Fallback only if the alert service is down
        const FALLBACK_WHATSAPP = '923008489291';
        const path = location.pathname.split('/').filter(Boolean).pop() || '';
        const TAG_ID = decodeURIComponent(path).replace(/\.html$/i, '').toUpperCase();
        const VALID = /^RBC-[A-Z0-9]{5,10}$/.test(TAG_ID);
        let chosen = null, chosenLabel = '';

        document.getElementById('tagId').textContent = VALID ? 'Tag ID: ' + TAG_ID : 'Unknown tag';
        document.title = 'RabtaCar Alert - Tag ' + (VALID ? TAG_ID : '');

        function selectIssue(btn, code, issue, icon) {
            document.querySelectorAll('.alert-button').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            chosen = code; chosenLabel = icon + ' ' + issue;
            document.getElementById('selectedIssueText').textContent = chosenLabel;
            document.getElementById('status').className = 'status';
            const container = document.getElementById('whatsappContainer');
            container.classList.add('show');
            if (code === 'other') document.getElementById('note').focus();
            setTimeout(() => container.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
        }

        async function sendAlert() {
            const note = document.getElementById('note').value.trim();
            if (!VALID) return show('err', 'This is not a valid RabtaCar tag. Please scan the QR again.');
            if (!chosen) return;
            if (chosen === 'other' && note.length < 3)
                return show('err', 'Please write what the problem is. / براہ کرم مسئلہ لکھیں۔');

            const btn = document.getElementById('notifyBtn');
            btn.disabled = true;
            btn.querySelector('.button-text-en').textContent = 'Sending…';
            try {
                const r = await fetch('/api/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tag: TAG_ID, issue: chosen, note })
                });
                const d = await r.json().catch(() => ({}));
                if (r.status === 429) show('err', 'Too many reports from this phone. Please wait a minute.');
                else if (d.ok && d.status === 'already_notified')
                    show('ok', '✅ The owner was already alerted a few minutes ago. Thank you!<br>مالک کو چند منٹ پہلے اطلاع دی جا چکی ہے۔ شکریہ!');
                else if (d.ok)
                    show('ok', '✅ The owner has been alerted by SMS. Thank you for helping!<br>مالک کو اطلاع دے دی گئی ہے۔ شکریہ!');
                else if (d.error === 'tag_not_found')
                    show('err', 'This tag is not active yet. / یہ ٹیگ ابھی فعال نہیں ہے۔');
                else fallback();
            } catch (e) {
                fallback();
            }
            btn.disabled = false;
            btn.querySelector('.button-text-en').textContent = 'Notify Owner';
        }

        function fallback() {
            const note = document.getElementById('note').value.trim();
            const msg = 'Hello RabtaCar, I need to contact the owner of vehicle with Tag: ' + TAG_ID +
                        '. Issue: ' + chosenLabel + (note ? ' — ' + note : '');
            show('err', 'Could not send automatically. ' +
                 '<a href="https://wa.me/' + FALLBACK_WHATSAPP + '?text=' + encodeURIComponent(msg) +
                 '">Tap here to report on WhatsApp</a>');
        }

        function show(kind, html) {
            const el = document.getElementById('status');
            el.innerHTML = html;
            el.className = 'status ' + kind;
        }
    </script>
</body>
</html>
